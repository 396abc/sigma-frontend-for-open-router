<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#060907" />
<title>MainframeOpSec AI — Secure Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — MainframeOpSec design system
   A hardened-terminal aesthetic: phosphor-green readouts,
   amber alert accents, scanline atmosphere, classified-log
   framing. Everything is styled like a secure ops console,
   not a generic dark chatbot.
============================================================ */
:root{
  --void:            #060907;
  --void-2:          #0a0f0c;
  --panel:           rgba(14, 20, 17, 0.62);
  --panel-solid:     #0d1310;
  --panel-raised:    rgba(22, 30, 25, 0.7);
  --hair:            rgba(120, 200, 160, 0.12);
  --hair-strong:     rgba(120, 200, 160, 0.24);
  --phosphor:        #3dffa0;
  --phosphor-dim:    #1f6b47;
  --phosphor-glow:   rgba(61, 255, 160, 0.45);
  --amber:           #ffb454;
  --amber-glow:      rgba(255, 180, 84, 0.45);
  --danger:          #ff5c5c;
  --text-hi:         #eaf7ef;
  --text:            #b9ccc0;
  --text-mute:       #6f8a7c;
  --text-dim:        #3d5347;

  --font-display:    'JetBrains Mono', monospace;
  --font-mono:       'IBM Plex Mono', monospace;
  --font-body:       'Inter', sans-serif;

  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 8px;

  --ease: cubic-bezier(.22,1,.36,1);
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin:0;
  background: var(--void);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  overflow-x: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
::selection{ background: var(--phosphor-dim); color: var(--text-hi); }

/* scrollbars */
*::-webkit-scrollbar{ width:8px; height:8px; }
*::-webkit-scrollbar-track{ background: transparent; }
*::-webkit-scrollbar-thumb{ background: var(--hair-strong); border-radius: 10px; }
*::-webkit-scrollbar-thumb:hover{ background: var(--phosphor-dim); }

/* ============================================================
   ATMOSPHERE — layered background: radial glow field,
   drifting particle canvas, and a faint CRT scanline overlay.
============================================================ */
.atmosphere{
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 50% at 18% 8%, rgba(61,255,160,0.09), transparent 60%),
    radial-gradient(50% 45% at 85% 15%, rgba(255,180,84,0.06), transparent 60%),
    radial-gradient(80% 60% at 50% 100%, rgba(20,60,45,0.16), transparent 70%),
    var(--void);
}
#particleCanvas{ position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55; }
.scanlines{
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.018) 0px,
    rgba(255,255,255,0.018) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: overlay;
  animation: scan-drift 9s linear infinite;
}
@keyframes scan-drift{ 0%{ background-position: 0 0; } 100%{ background-position: 0 60px; } }
.vignette{
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  box-shadow: inset 0 0 220px rgba(0,0,0,0.65);
}

/* ============================================================
   APP SHELL
============================================================ */
.app{
  position: relative; z-index: 2;
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100vh;
  transition: grid-template-columns .45s var(--ease);
}
.app.sidebar-collapsed{ grid-template-columns: 0px 1fr; }

.sidebar-scrim{
  display: none;
  position: fixed; inset: 0; z-index: 25;
  background: rgba(3,5,4,0.6);
  backdrop-filter: blur(2px);
  opacity: 0;
  transition: opacity .35s var(--ease);
}

/* ============================================================
   SIDEBAR
============================================================ */
.sidebar{
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(13,19,16,0.86), rgba(9,13,11,0.92));
  border-right: 1px solid var(--hair);
  display: flex; flex-direction: column;
  min-width: 0;
  transition: opacity .35s var(--ease);
  backdrop-filter: blur(18px);
}
.app.sidebar-collapsed .sidebar{ opacity: 0; pointer-events: none; }

.brand{
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--hair);
}
.brand-mark{
  display:flex; align-items:baseline; gap: 8px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.5px;
  color: var(--text-hi);
}
.brand-mark .slash{ color: var(--phosphor); }
.brand-cursor{
  display:inline-block; width:8px; height:15px; background: var(--phosphor);
  box-shadow: 0 0 8px var(--phosphor-glow);
  animation: blink 1.1s steps(1) infinite;
}
@keyframes blink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
.brand-sub{
  margin-top: 6px; font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 1.6px; text-transform: uppercase; color: var(--text-mute);
}

.new-session{
  margin: 16px 16px 10px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: linear-gradient(180deg, rgba(61,255,160,0.10), rgba(61,255,160,0.04));
  border: 1px solid rgba(61,255,160,0.28);
  color: var(--text-hi);
  font-family: var(--font-mono);
  font-size: 12.5px;
  letter-spacing: 0.4px;
  display:flex; align-items:center; gap:10px;
  cursor: pointer;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
}
.new-session:hover{
  transform: translateY(-1px);
  box-shadow: 0 8px 24px -8px var(--phosphor-glow), inset 0 0 0 1px rgba(61,255,160,0.35);
  background: linear-gradient(180deg, rgba(61,255,160,0.16), rgba(61,255,160,0.05));
}
.new-session .plus{ font-size: 15px; color: var(--phosphor); }

.session-search{
  margin: 4px 16px 12px;
  position: relative;
}
.session-search input{
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--hair);
  border-radius: var(--r-sm);
  padding: 8px 10px 8px 30px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11.5px;
  outline: none;
  transition: border-color .2s;
}
.session-search input:focus{ border-color: var(--hair-strong); }
.session-search svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5; }

.session-log-label{
  padding: 4px 20px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.session-list{ flex:1; overflow-y: auto; padding: 0 10px 10px; }
.session-item{
  display:flex; align-items:flex-start; gap:10px;
  padding: 10px 10px;
  margin-bottom: 3px;
  border-radius: var(--r-sm);
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .2s, border-color .2s;
  position: relative;
}
.session-item:hover{ background: rgba(255,255,255,0.03); }
.session-item.active{
  background: rgba(61,255,160,0.06);
  border-color: rgba(61,255,160,0.22);
}
.session-dot{
  width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0;
  background: var(--text-dim);
}
.session-item.active .session-dot{
  background: var(--phosphor);
  box-shadow: 0 0 0 3px rgba(61,255,160,0.15);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot{
  0%,100%{ box-shadow: 0 0 0 2px rgba(61,255,160,0.12); }
  50%{ box-shadow: 0 0 0 5px rgba(61,255,160,0.06); }
}
.session-meta{ min-width:0; flex:1; }
.session-title{
  font-size: 12.5px; color: var(--text-hi); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-item.active .session-title{ color: var(--phosphor); }
.session-sub{
  margin-top:3px; display:flex; align-items:center; gap:6px;
  font-family: var(--font-mono); font-size: 9.5px; color: var(--text-mute);
}
.tag{
  font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .6px;
  padding: 1px 5px; border-radius: 3px; text-transform: uppercase;
}
.tag.active{ background: rgba(61,255,160,0.14); color: var(--phosphor); }
.tag.archived{ background: rgba(255,255,255,0.05); color: var(--text-mute); }

.sidebar-footer{
  border-top: 1px solid var(--hair);
  padding: 12px 16px;
}
.model-select-wrap{
  margin-bottom: 10px;
}
.field-label{
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
}

/* ============================================================
   CUSTOM DROPDOWN — wraps a native <select> (kept hidden but
   functional for events/persistence) with a styled trigger +
   floating menu. Depth via layered shadow, not glow, per the
   restrained dark-UI language (Linear/Raycast-style).
============================================================ */
.cdd{ position: relative; }
.cdd-native{
  position: absolute; inset: 0; opacity: 0; pointer-events: none;
}
.cdd-trigger{
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--hair);
  color: var(--text-hi);
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 9px 11px;
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.cdd-trigger:hover{ border-color: var(--hair-strong); background: rgba(255,255,255,0.05); }
.cdd.open .cdd-trigger{ border-color: var(--phosphor-dim); }
.cdd-trigger-label{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cdd-chevron{ flex-shrink: 0; opacity: .6; transition: transform .2s var(--ease); }
.cdd.open .cdd-chevron{ transform: rotate(180deg); }
.cdd-menu{
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 45;
  background: #0c1210;
  border: 1px solid var(--hair-strong);
  border-radius: var(--r-md);
  box-shadow: 0 16px 40px -12px rgba(0,0,0,0.65), 0 2px 6px rgba(0,0,0,0.4);
  padding: 5px;
  max-height: 280px; overflow-y: auto;
  opacity: 0; transform: translateY(-4px) scale(.98); pointer-events: none;
  transition: opacity .16s var(--ease), transform .16s var(--ease);
}
.cdd.open .cdd-menu{ opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }
.cdd-option{
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 9px; border-radius: 6px; cursor: pointer;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cdd-option:hover, .cdd-option.focused{ background: rgba(255,255,255,0.06); }
.cdd-option.selected{ color: var(--phosphor); }
.cdd-option.selected::after{ content: '✓'; flex-shrink: 0; }
.cdd-option.muted{ color: var(--text-dim); cursor: default; }
.cdd-option.muted:hover{ background: none; }
.cdd-divider{ height: 1px; background: var(--hair); margin: 4px 2px; }

.operator{
  display:flex; align-items:center; gap:10px;
  padding: 8px; border-radius: var(--r-sm);
  cursor: pointer; transition: background .2s;
}
.operator:hover{ background: rgba(255,255,255,0.03); }
.operator-avatar{
  width: 32px; height:32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--phosphor-dim), var(--void-2));
  border: 1px solid var(--hair-strong);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-size: 12px; color: var(--phosphor); font-weight:700;
}
.operator-name{ font-size: 12.5px; color: var(--text-hi); font-weight: 500; }
.operator-clearance{
  font-family: var(--font-mono); font-size: 9px; color: var(--amber); letter-spacing: .5px;
}

/* ============================================================
   MAIN COLUMN
============================================================ */
.main{
  position: relative;
  display: flex; flex-direction: column;
  min-width: 0; height: 100vh;
}

.topbar{
  display:flex; align-items:center; gap: 14px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--hair);
  background: rgba(8,12,10,0.4);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}
.icon-btn{
  width: 32px; height: 32px; border-radius: var(--r-sm);
  display:flex; align-items:center; justify-content:center;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--hair);
  color: var(--text-mute);
  cursor: pointer;
  transition: all .2s var(--ease);
}
.icon-btn:hover{ color: var(--phosphor); border-color: var(--hair-strong); background: rgba(61,255,160,0.06); }

.topbar-title{
  font-family: var(--font-display); font-size: 13px; color: var(--text-hi); font-weight: 600;
}
.topbar-sub{
  font-family: var(--font-mono); font-size: 10px; color: var(--text-mute); margin-top: 2px;
}
.topbar-meters{
  margin-left: auto; display:flex; align-items:center; gap: 18px;
}
.meter{ text-align: right; }
.meter-label{ font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
.meter-value{ font-family: var(--font-mono); font-size: 12px; color: var(--text-hi); }
.ctx-bar{
  width: 110px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06);
  overflow: hidden; margin-top: 5px;
}
.ctx-bar-fill{
  height: 100%; width: 6%;
  background: linear-gradient(90deg, var(--phosphor-dim), var(--phosphor));
  box-shadow: 0 0 8px var(--phosphor-glow);
  transition: width .5s var(--ease);
}

/* ============================================================
   MESSAGES
============================================================ */
.chat-scroll{
  flex: 1; overflow-y: auto;
  padding: 30px 20px 160px;
  scroll-behavior: smooth;
}
.chat-inner{ max-width: 760px; margin: 0 auto; display:flex; flex-direction:column; gap: 22px; }

.empty-state{
  max-width: 560px; margin: 8vh auto 0; text-align:center;
}
.empty-glyph{
  width: 56px; height: 56px; margin: 0 auto 18px;
  border-radius: 14px;
  border: 1px solid var(--hair-strong);
  background: linear-gradient(160deg, rgba(61,255,160,0.12), rgba(61,255,160,0.02));
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 0 30px -6px var(--phosphor-glow);
}
.empty-state h2{
  font-family: var(--font-display); color: var(--text-hi); font-size: 19px;
  margin: 0 0 8px; letter-spacing: .3px;
}
.empty-state p{ color: var(--text-mute); font-size: 13.5px; line-height: 1.6; margin: 0 0 22px; }
.suggestion-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.suggestion{
  text-align:left; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--panel); border: 1px solid var(--hair);
  cursor:pointer; transition: all .25s var(--ease);
}
.suggestion:hover{ border-color: var(--hair-strong); transform: translateY(-2px); box-shadow: 0 10px 26px -14px rgba(0,0,0,.6); }
.suggestion .s-title{ font-size: 12.5px; color: var(--text-hi); font-weight:500; margin-bottom:3px; }
.suggestion .s-sub{ font-size: 11px; color: var(--text-mute); font-family: var(--font-mono); }

.msg{
  display:flex; gap: 12px;
  animation: msg-in .45s var(--ease) both;
}
@keyframes msg-in{
  from{ opacity:0; transform: translateY(10px) scale(.99); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}
.msg-avatar{
  width: 30px; height: 30px; border-radius: 8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-size: 10px; font-weight: 700;
  margin-top: 2px;
}
.msg.user .msg-avatar{
  background: rgba(255,180,84,0.1); border: 1px solid rgba(255,180,84,0.3); color: var(--amber);
}
.msg.ai .msg-avatar{
  background: rgba(61,255,160,0.1); border: 1px solid rgba(61,255,160,0.3); color: var(--phosphor);
}
.msg-body{ min-width: 0; flex: 1; }
.msg-head{
  display:flex; align-items:baseline; gap:8px; margin-bottom: 5px;
}
.msg-role{ font-family: var(--font-mono); font-size: 11px; font-weight:600; letter-spacing: .4px; color: var(--text-hi); }
.msg.user .msg-role{ color: var(--amber); }
.msg.ai .msg-role{ color: var(--phosphor); }
.msg-time{ font-family: var(--font-mono); font-size: 9.5px; color: var(--text-dim); }
.msg-hash{ font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); margin-left: auto; }

.bubble{
  background: var(--panel);
  border: 1px solid var(--hair);
  border-radius: var(--r-md);
  padding: 12px 15px;
  font-size: 13.8px; line-height: 1.65;
  color: var(--text);
  backdrop-filter: blur(14px);
  position: relative;
}
.msg.user .bubble{ background: rgba(255,180,84,0.045); border-color: rgba(255,180,84,0.14); }
.bubble p{ margin: 0 0 8px; }
.bubble p:last-child{ margin-bottom: 0; }
.bubble ul{ margin: 6px 0; padding-left: 20px; }
.bubble li{ margin-bottom: 4px; }
.bubble strong{ color: var(--text-hi); }
.bubble code.inline{
  background: rgba(61,255,160,0.08); color: var(--phosphor);
  padding: 1px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: 12.5px;
}

.codeblock{
  margin: 10px 0; border-radius: var(--r-sm); overflow:hidden;
  border: 1px solid var(--hair-strong);
  background: #080b09;
}
.codeblock-head{
  display:flex; align-items:center; justify-content:space-between;
  padding: 7px 12px; background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--hair);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute);
}
.copy-btn{
  display:flex; align-items:center; gap:5px;
  background: none; border: 1px solid var(--hair-strong); color: var(--text-mute);
  font-family: var(--font-mono); font-size: 10px;
  padding: 3px 8px; border-radius: 5px; cursor:pointer;
  transition: all .2s var(--ease);
}
.copy-btn:hover{ color: var(--phosphor); border-color: var(--phosphor-dim); }
.copy-btn.copied{ color: var(--phosphor); border-color: var(--phosphor); }
.codeblock pre{
  margin:0; padding: 12px 14px; overflow-x:auto;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
  color: #cdeedd;
}
.tok-kw{ color: #ff8fb3; } .tok-str{ color: #ffd479; } .tok-com{ color: #5c7a6c; } .tok-fn{ color: #6fd8ff; } .tok-num{ color: #b592ff; }

/* reasoning trace (shown when reasoning mode is on) */
.reasoning{
  margin-bottom: 8px;
  border: 1px dashed var(--hair-strong);
  border-radius: var(--r-sm);
  background: rgba(255,180,84,0.03);
  overflow: hidden;
  animation: msg-in .4s var(--ease) both;
}
.reasoning-head{
  display:flex; align-items:center; gap:8px;
  padding: 8px 12px; cursor: pointer;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--amber); letter-spacing:.4px;
}
.reasoning-head svg{ transition: transform .25s var(--ease); }
.reasoning.open .reasoning-head svg{ transform: rotate(90deg); }
.reasoning-body{
  max-height: 0; overflow:hidden; transition: max-height .35s var(--ease);
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-mute);
  padding: 0 12px; line-height: 1.7;
}
.reasoning.open .reasoning-body{ max-height: 240px; padding: 0 12px 12px; overflow-y:auto; }

/* tool usage indicator */
.tool-badge{
  display:inline-flex; align-items:center; gap:7px;
  padding: 6px 11px; border-radius: 20px;
  background: rgba(111,216,255,0.08); border: 1px solid rgba(111,216,255,0.25);
  font-family: var(--font-mono); font-size: 10.5px; color: #6fd8ff;
  margin-bottom: 8px;
  animation: msg-in .3s var(--ease) both;
}
.tool-badge .tool-spin{
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid rgba(111,216,255,0.35); border-top-color: #6fd8ff;
  animation: spin .7s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

/* typing indicator */
.typing{ display:flex; align-items:center; gap: 10px; }
.typing-dots{ display:flex; gap: 4px; padding: 12px 15px; }
.typing-dots span{
  width:6px; height:6px; border-radius:50%; background: var(--phosphor);
  animation: bounce 1.1s infinite ease-in-out;
  box-shadow: 0 0 6px var(--phosphor-glow);
}
.typing-dots span:nth-child(2){ animation-delay: .15s; }
.typing-dots span:nth-child(3){ animation-delay: .3s; }
@keyframes bounce{ 0%,60%,100%{ transform: translateY(0); opacity:.5; } 30%{ transform: translateY(-5px); opacity:1; } }

.cursor-blip{
  display:inline-block; width:7px; height:14px; background: var(--phosphor);
  margin-left:2px; vertical-align: middle; box-shadow: 0 0 6px var(--phosphor-glow);
  animation: blink 0.9s steps(1) infinite;
}

/* ============================================================
   COMPOSER — floating glass console
============================================================ */
.composer-dock{
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 20px 20px;
  display:flex; justify-content:center;
  pointer-events: none;
}
.composer{
  pointer-events: all;
  width: 100%; max-width: 760px;
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(18,26,22,0.82), rgba(11,16,13,0.9));
  border: 1px solid var(--hair-strong);
  backdrop-filter: blur(22px);
  box-shadow: 0 -10px 40px -18px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.2);
  padding: 12px 14px 12px;
  transition: box-shadow .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  position: relative;
  overflow: hidden;
}
.composer::before{
  content:''; position:absolute; inset:-2px; border-radius: inherit; padding: 1px;
  background: linear-gradient(120deg, transparent, rgba(61,255,160,0.35), transparent);
  background-size: 200% 200%;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0; transition: opacity .3s;
  animation: liquid-border 6s linear infinite;
  pointer-events: none; /* was silently eating clicks meant for the textarea underneath */
}
.composer.focused::before{ opacity: 1; }
@keyframes liquid-border{ 0%{ background-position: 0% 50%; } 100%{ background-position: 200% 50%; } }
.composer.focused{
  border-color: rgba(61,255,160,0.4);
  box-shadow: 0 -10px 50px -14px var(--phosphor-glow), 0 0 0 1px rgba(0,0,0,0.2);
  transform: translateY(-2px);
}

.composer-toprow{
  display:flex; align-items:center; gap: 8px; flex-wrap: wrap;
  padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--hair);
}
.chip{
  display:flex; align-items:center; gap:6px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute);
  padding: 5px 10px; border-radius: 20px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--hair);
}
.chip.model-chip{ color: var(--text-hi); }
.chip.model-chip .dot{ width:6px; height:6px; border-radius:50%; background: var(--phosphor); }

/* Options popover — trigger reuses .cdd-trigger; menu holds toggle rows */
.options-popover{ position: relative; width: auto; }
.options-trigger{ width: auto; padding: 6px 10px 6px 9px; border-radius: 20px; gap: 6px; }
.options-badge{
  min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
  background: var(--phosphor-dim); color: #06120c; font-size: 9px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.options-menu{ left: 0; right: auto; width: 220px; }

.toggle{
  display:flex; align-items:center; justify-content: space-between; gap:10px; cursor:pointer;
  padding: 8px 8px; border-radius: 7px;
  transition: background .15s;
  user-select: none;
}
.toggle:hover{ background: rgba(255,255,255,0.04); }
.toggle-text{ display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.toggle-label{ font-family: var(--font-mono); font-size: 11px; color: var(--text-hi); }
.toggle-desc{ font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.switch{
  width: 26px; height: 15px; border-radius: 10px; background: rgba(255,255,255,0.08);
  position: relative; transition: background .2s var(--ease);
  flex-shrink:0;
}
.switch::after{
  content:''; position:absolute; top:2px; left:2px; width:11px; height:11px; border-radius:50%;
  background: var(--text-mute); transition: all .2s var(--ease);
}
.toggle.on .switch{ background: var(--phosphor-dim); }
.toggle.on .switch::after{ left: 13px; background: var(--phosphor); }
.toggle.amber.on .switch{ background: rgba(255,180,84,0.32); }
.toggle.amber.on .switch::after{ background: var(--amber); }
.toggle.blue.on .switch{ background: rgba(111,216,255,0.28); }
.toggle.blue.on .switch::after{ background: #6fd8ff; }

.tool-live{
  margin-left: auto; display:flex; align-items:center; gap:6px;
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
}
.tool-live .pip{ width:6px; height:6px; border-radius:50%; background: var(--text-dim); transition: all .3s; }
.tool-live.active .pip{ background: #6fd8ff; animation: pulse-dot 1.4s infinite; }
.tool-live.active{ color: #6fd8ff; }

.attach-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 8px; }
.attach-chip{
  display:flex; align-items:center; gap:6px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text);
  background: rgba(255,255,255,0.04); border: 1px solid var(--hair-strong);
  padding: 5px 8px 5px 10px; border-radius: 8px;
  animation: msg-in .3s var(--ease) both;
}
.attach-chip button{ background:none; border:none; color: var(--text-mute); cursor:pointer; font-size: 13px; line-height:1; padding: 0 2px; }
.attach-chip button:hover{ color: var(--danger); }

.composer-inputrow{ display:flex; align-items:flex-end; gap:10px; }
textarea#messageInput{
  flex:1; resize:none; background: transparent; border: none; outline: none;
  color: var(--text-hi); font-family: var(--font-body); font-size: 14px; line-height:1.5;
  max-height: 160px; padding: 6px 4px;
}
textarea#messageInput::placeholder{ color: var(--text-dim); }

.icon-round{
  width: 36px; height: 36px; border-radius: 50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background: rgba(255,255,255,0.04); border: 1px solid var(--hair-strong);
  color: var(--text-mute); cursor:pointer;
  transition: transform .18s var(--ease), color .2s, border-color .2s, box-shadow .2s;
}
.icon-round:hover{ color: var(--phosphor); border-color: var(--phosphor-dim); }

.send-btn{
  width: 40px; height: 40px; border-radius: 50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(150deg, var(--phosphor), #1fae6e);
  border: none; color: #06120c; cursor:pointer;
  box-shadow: 0 4px 14px -4px rgba(0,0,0,0.4);
  transition: transform .18s var(--ease), box-shadow .18s var(--ease), filter .2s, background .2s;
}
.send-btn:hover{ filter: brightness(1.08); }
.send-btn:active{ transform: scale(.92); }
.send-btn:disabled{ opacity: .35; filter: none; box-shadow:none; cursor:not-allowed; }
.send-btn .stop-icon{ display: none; }
.send-btn.stop-mode{ background: linear-gradient(150deg, #ff8080, var(--danger)); }
.send-btn.stop-mode .send-icon{ display: none; }
.send-btn.stop-mode .stop-icon{ display: block; }
.send-btn.stop-mode:disabled{ opacity: 1; }

.composer-footrow{
  display:flex; align-items:center; justify-content:space-between;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--hair);
}
.foot-hint{ font-family: var(--font-mono); font-size: 9.5px; color: var(--text-dim); }
.foot-hint kbd{
  background: rgba(255,255,255,0.05); border: 1px solid var(--hair-strong);
  padding: 1px 5px; border-radius: 4px; font-family: var(--font-mono); color: var(--text-mute);
}
.token-readout{ font-family: var(--font-mono); font-size: 9.5px; color: var(--text-dim); }
.token-readout b{ color: var(--text-mute); font-weight: 500; }

/* ============================================================
   CONNECTION CARD STATES
============================================================ */
.operator{ cursor: pointer; }
.operator-avatar.connected{ color: var(--phosphor); border-color: rgba(61,255,160,0.4); }
.operator-avatar.error{ color: var(--danger); border-color: rgba(255,92,92,0.4); }
.operator-clearance.connected{ color: var(--phosphor); }
.operator-clearance.error{ color: var(--danger); }

/* ============================================================
   MODAL — API key entry / session naming
============================================================ */
.modal-scrim{
  position: fixed; inset: 0; z-index: 60;
  background: rgba(3,5,4,0.72); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .25s var(--ease);
  padding: 20px;
}
.modal-scrim.open{ opacity: 1; pointer-events: all; }
.modal{
  width: 100%; max-width: 400px;
  background: linear-gradient(180deg, rgba(18,26,22,0.96), rgba(10,15,12,0.98));
  border: 1px solid var(--hair-strong);
  border-radius: var(--r-lg);
  padding: 22px 22px 18px;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 40px -10px var(--phosphor-glow);
  transform: translateY(14px) scale(.97); opacity: 0;
  transition: transform .3s var(--ease), opacity .3s var(--ease);
}
.modal-scrim.open .modal{ transform: translateY(0) scale(1); opacity: 1; }
.modal-head{ display:flex; align-items:center; gap: 10px; margin-bottom: 8px; }
.modal-glyph{ font-family: var(--font-display); color: var(--phosphor); font-size: 15px; }
.modal-head h3{ margin:0; font-family: var(--font-display); font-size: 15px; color: var(--text-hi); font-weight: 700; }
.modal-copy{ font-size: 12.5px; color: var(--text-mute); line-height: 1.6; margin: 0 0 14px; }
.modal-input{
  width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--hair-strong);
  border-radius: var(--r-sm); padding: 10px 12px; color: var(--text-hi);
  font-family: var(--font-mono); font-size: 12.5px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.modal-input:focus{ border-color: var(--phosphor-dim); box-shadow: 0 0 0 3px rgba(61,255,160,0.1); }
.modal-error{
  font-family: var(--font-mono); font-size: 11px; color: var(--danger); min-height: 15px; margin-top: 8px;
}
.modal-actions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 14px; }
.modal-btn{
  font-family: var(--font-mono); font-size: 11.5px; padding: 8px 14px; border-radius: var(--r-sm);
  cursor: pointer; border: 1px solid var(--hair-strong); background: rgba(255,255,255,0.03); color: var(--text);
  transition: all .2s var(--ease);
}
.modal-btn:hover{ border-color: var(--hair-strong); background: rgba(255,255,255,0.06); }
.modal-btn.primary{ background: linear-gradient(150deg, var(--phosphor), #1fae6e); color: #06120c; border: none; font-weight: 600; }
.modal-btn.primary:hover{ filter: brightness(1.08); }
.modal-btn.primary:disabled{ opacity: .5; cursor: not-allowed; filter:none; }
.modal-btn.secondary{ color: var(--danger); border-color: rgba(255,92,92,0.3); }
.modal-btn.ghost{ background: none; }
.modal-hint{ margin-top: 14px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-align:center; }
.modal-hint a{ color: var(--phosphor); text-decoration: none; }
.modal-hint a:hover{ text-decoration: underline; }

/* ============================================================
   API ERROR / SYSTEM MESSAGE BUBBLE
============================================================ */
.msg.system .bubble{
  background: rgba(255,92,92,0.06); border-color: rgba(255,92,92,0.25); color: #ffb3b3;
  font-family: var(--font-mono); font-size: 12.5px;
}
.msg.system .msg-avatar{ background: rgba(255,92,92,0.1); border-color: rgba(255,92,92,0.3); color: var(--danger); }

/* citation / search result footer on a message */
.citations{ margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--hair); display:flex; flex-wrap:wrap; gap:6px; }
.citation-chip{
  font-family: var(--font-mono); font-size: 10px; color: #6fd8ff;
  background: rgba(111,216,255,0.06); border: 1px solid rgba(111,216,255,0.2);
  padding: 3px 8px; border-radius: 6px; text-decoration: none; max-width: 220px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display:inline-block;
}
.citation-chip:hover{ border-color: rgba(111,216,255,0.5); }
.usage-line{
  margin-top: 6px; font-family: var(--font-mono); font-size: 9.5px; color: var(--text-dim);
}
.attach-chip.image-chip{ padding: 3px; }
.attach-chip.image-chip img{ width: 26px; height: 26px; border-radius: 5px; object-fit: cover; display:block; }

/* ============================================================
   SYSTEM PROMPT PANEL — slide-in drawer from the right
============================================================ */
.prompt-scrim{
  position: fixed; inset: 0; z-index: 55;
  background: rgba(3,5,4,0.6); backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity .35s var(--ease);
}
.prompt-scrim.open{ opacity: 1; pointer-events: all; }
.prompt-panel{
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 56;
  width: min(400px, 92vw);
  background: linear-gradient(180deg, rgba(14,20,17,0.94), rgba(8,12,10,0.97));
  border-left: 1px solid var(--hair-strong);
  backdrop-filter: blur(20px);
  box-shadow: -20px 0 60px -20px rgba(0,0,0,0.7);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform .38s var(--ease);
}
.prompt-panel.open{ transform: translateX(0); }
.prompt-panel-head{
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 18px 14px; border-bottom: 1px solid var(--hair);
}
.prompt-panel-title{
  font-family: var(--font-display); font-size: 13px; color: var(--text-hi);
  font-weight: 700; letter-spacing: .6px;
}
.prompt-panel-body{ padding: 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
.prompt-panel-body select{
  width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--hair-strong);
  color: var(--text); font-family: var(--font-mono); font-size: 12px; padding: 9px 10px;
  border-radius: var(--r-sm); outline: none; cursor: pointer; appearance: none;
  transition: border-color .2s;
}
.prompt-panel-body select:focus{ border-color: var(--phosphor-dim); }
#systemPromptInput{
  flex: 1; min-height: 260px; margin-top: 8px; resize: vertical;
  background: rgba(255,255,255,0.03); border: 1px solid var(--hair-strong);
  border-radius: var(--r-sm); padding: 12px 13px; color: var(--text-hi);
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
#systemPromptInput:focus{ border-color: var(--phosphor-dim); box-shadow: 0 0 0 3px rgba(61,255,160,0.08); }
.prompt-panel-hint{
  margin-top: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); line-height: 1.6;
}

/* ============================================================
   ANIMATION UTILITIES — reused across dynamically-inserted UI
============================================================ */
@keyframes pop-in{
  from{ opacity: 0; transform: translateY(6px) scale(.98); }
  to{ opacity: 1; transform: translateY(0) scale(1); }
}
.pop-in{ animation: pop-in .3s var(--ease) both; }
@keyframes pop-out{
  from{ opacity: 1; transform: scale(1); max-height: 60px; }
  to{ opacity: 0; transform: scale(.9); max-height: 0; margin: 0; padding: 0; border-width: 0; }
}
.pop-out{ animation: pop-out .22s var(--ease) both; overflow: hidden; }
.chat-inner{ transition: opacity .22s ease; }

/* ============================================================
   OPSEC GATE — perimeter check overlay, shown before the app
============================================================ */
#opsecGate{
  position: fixed; inset: 0; z-index: 200;
  background: rgba(6,9,7,0.86);
  backdrop-filter: blur(1px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  transition: opacity .5s var(--ease);
}
#opsecGate.gate-hidden{ opacity: 0; pointer-events: none; }
.gate-panel{
  width: 100%; max-width: 480px;
  max-height: 88vh; overflow-y: auto;
  border: 1px solid var(--hair-strong);
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(14,20,17,0.75), rgba(8,12,10,0.9));
  backdrop-filter: blur(16px);
  padding: 26px 26px 22px;
  box-shadow: 0 30px 90px -20px rgba(0,0,0,0.8);
}
.gate-head{ display:flex; align-items:center; gap:10px; margin-bottom: 6px; }
.gate-head svg{ color: var(--phosphor); flex-shrink:0; }
.gate-head h2{ margin:0; font-family: var(--font-display); font-size: 15px; color: var(--text-hi); letter-spacing: .5px; }
.gate-sub{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute); margin: 0 0 18px; letter-spacing: .5px; }
.gate-log{
  font-family: var(--font-mono); font-size: 11.5px; line-height: 1.9; color: var(--text-mute);
  min-height: 96px; margin-bottom: 16px;
}
.gate-log-line{ display:flex; align-items:center; gap: 8px; opacity: 0; animation: msg-in .35s var(--ease) forwards; }
.gate-log-line .gl-icon{ width: 12px; flex-shrink:0; text-align:center; }
.gate-log-line.ok .gl-icon{ color: var(--phosphor); }
.gate-log-line.pending .gl-icon{ color: var(--text-dim); }
.gate-log-line.fail .gl-icon{ color: var(--danger); }
.gate-status{
  border-radius: var(--r-md); padding: 14px 16px; margin-bottom: 14px;
  font-family: var(--font-mono); border: 1px solid var(--hair-strong);
  display: none;
}
.gate-status.show{ display: block; animation: msg-in .4s var(--ease) both; }
.gate-status.pass{ background: rgba(61,255,160,0.07); border-color: rgba(61,255,160,0.3); }
.gate-status.fail{ background: rgba(255,92,92,0.07); border-color: rgba(255,92,92,0.3); }
.gate-status-title{ font-size: 13px; font-weight: 700; letter-spacing: .5px; margin-bottom: 6px; }
.gate-status.pass .gate-status-title{ color: var(--phosphor); }
.gate-status.fail .gate-status-title{ color: var(--danger); }
.gate-status-body{ font-size: 11px; color: var(--text-mute); line-height: 1.6; }
.gate-detail{
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--hair);
  display: flex; flex-direction: column; gap: 3px;
}
.gate-detail-ip{
  font-family: var(--font-mono); font-size: 10px; color: var(--text-mute);
  margin-bottom: 4px; letter-spacing: .3px;
}
.gdr{
  display: flex; align-items: center; gap: 8px; padding: 2px 0;
  font-family: var(--font-mono); font-size: 10.5px; cursor: help;
}
.gdr-dot{ width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
.gdr.hit .gdr-dot{ background: var(--phosphor); box-shadow: 0 0 6px var(--phosphor-glow); }
.gdr-label{
  flex: 1; color: var(--text-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gdr.hit .gdr-label{ color: var(--text-hi); }
.gdr-tag{ font-size: 9px; letter-spacing: .4px; color: var(--text-dim); flex-shrink: 0; }
.gdr.hit .gdr-tag{ color: var(--phosphor); font-weight: 600; }
.gate-actions{ display:flex; align-items:center; justify-content:space-between; gap: 10px; margin-top: 4px; }
.gate-retry{
  font-family: var(--font-mono); font-size: 11.5px; padding: 9px 16px; border-radius: var(--r-sm);
  background: linear-gradient(150deg, var(--phosphor), #1fae6e); color: #06120c; border: none; font-weight: 600;
  cursor: pointer; transition: filter .2s;
}
.gate-retry:hover{ filter: brightness(1.08); }
.gate-override{
  font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); background:none; border:none;
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.gate-override:hover{ color: var(--text-mute); }
#app{ transition: opacity .4s var(--ease); }
#app.app-locked{ opacity: 0; pointer-events: none; }

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 900px){
  .app{ grid-template-columns: 0px 1fr; }
  .sidebar{
    position: fixed; top:0; left:0; bottom:0;
    width: min(300px, 84vw); z-index: 30;
    padding-top: env(safe-area-inset-top);
    transform: translateX(-100%); transition: transform .38s var(--ease);
    opacity: 1 !important; pointer-events: all !important;
  }
  .app.sidebar-collapsed .sidebar{ transform: translateX(-100%); }
  .app.sidebar-open .sidebar{ transform: translateX(0); box-shadow: 30px 0 60px rgba(0,0,0,.55); }
  .app.sidebar-open .sidebar-scrim{ display:block; opacity:1; }

  .topbar{ padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top)); gap: 10px; }
  .topbar-meters{ display:none; }
  .topbar-title{ font-size: 12px; max-width: 46vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar-sub{ display:none; }

  .icon-btn{ width: 38px; height: 38px; }

  .chat-scroll{ padding: 18px 12px 190px; }
  .empty-state{ margin-top: 4vh; }
  .empty-state h2{ font-size: 17px; }
  .suggestion-grid{ grid-template-columns: 1fr; }

  .composer-dock{ padding: 0 10px calc(12px + env(safe-area-inset-bottom)); }
  .composer{ padding: 10px 10px 10px; border-radius: 18px; }
  .composer-toprow{ gap: 6px; }
  .chip.model-chip{ order: -1; flex-basis: 100%; }
  .toggle{ font-size: 10px; padding: 5px 8px 5px 5px; }
  .tool-live{ margin-left: 0; flex-basis: 100%; order: 2; }

  textarea#messageInput{ font-size: 16px; } /* prevents iOS auto-zoom on focus */
  .icon-round, .send-btn{ width: 40px; height: 40px; }

  .msg-avatar{ width: 26px; height: 26px; }
  .bubble{ font-size: 13.5px; padding: 11px 13px; }
  .msg-hash{ display:none; }

  .foot-hint{ font-size: 9px; }
}

@media (max-width: 420px){
  .brand{ padding: 18px 16px 14px; }
  .new-session{ margin: 14px 14px 8px; }
  .composer-toprow .toggle .toggle-label{ display:none; } /* icon-only toggles on very small phones */
  .toggle{ padding: 6px; }
  .foot-hint{ display:none; }
}

<!-- ============ OPSEC GATE — VPN/proxy perimeter check ============ -->
<div id="opsecGate">
  <div class="gate-panel">
    <div class="gate-head">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/></svg>
      <h2>OPSEC LEVEL CHECK</h2>
    </div>
    <div class="gate-sub">MAINFRAME/OPSEC</div>

    <div class="gate-log" id="gateLog"></div>

    <div class="gate-status" id="gateStatus">
      <div class="gate-status-title" id="gateStatusTitle"></div>
      <div class="gate-status-body" id="gateStatusBody"></div>
      <div class="gate-detail" id="gateDetail"></div>
    </div>

    <div class="gate-actions" id="gateActions" style="display:none;">
      <button class="gate-retry" id="gateRetry">Re-run Scan</button>
      <button class="gate-override" id="gateOverride">Proceed without VPN →</button>
    </div>
  </div>
</div>

<!-- ============ BACKGROUND ATMOSPHERE ============ -->
<div class="atmosphere"></div>
<canvas id="particleCanvas"></canvas>
<div class="scanlines"></div>
<div class="vignette"></div>

<div id="assetRoot"></div>

<script>
/* ============================================================
   OPSEC GATE — best-effort client-side VPN/proxy detection.
   Runs TWO independent IP-intelligence lookups in parallel
   (dedicated VPN/proxy/datacenter/Tor database + ASN keyword
   cross-check against a broad provider list) and passes on
   ANY positive signal from either — this maximizes recall
   since no single free database enumerates every VPN exit
   node. Still a heuristic IP-reputation lookup, NOT real
   access control: anyone can bypass it via devtools, and
   privacy extensions (uBlock/NoScript/Brave shields) may
   block the lookup calls themselves, in which case we fail
   open to the manual override rather than lock you out.
============================================================ */
(function opsecGate(){
  const gateEl = document.getElementById('opsecGate');
  const logEl = document.getElementById('gateLog');
  const statusEl = document.getElementById('gateStatus');
  const statusTitle = document.getElementById('gateStatusTitle');
  const statusBody = document.getElementById('gateStatusBody');
  const detailEl = document.getElementById('gateDetail');
  const actionsEl = document.getElementById('gateActions');
  const retryBtn = document.getElementById('gateRetry');
  const overrideBtn = document.getElementById('gateOverride');

  // Org/ASN substrings that commonly show up on VPN exit nodes,
  // anonymizing relays, or the datacenter ranges VPN providers
  // rent — broad on purpose, since this runs as an OR alongside
  // the dedicated VPN database below, not standalone. Includes
  // major CDN/edge networks because privacy-relay products
  // (iCloud Private Relay, Google One VPN, Cloudflare WARP)
  // egress through generic-looking CDN/cloud org names rather
  // than a named "VPN" brand.
  const VPN_HOST_KEYWORDS = [
    'vpn','nordvpn','nord security','tefincom','expressvpn','surfshark','mullvad','proton','protonvpn',
    'private internet access',' pia ','kape technologies','cyberghost','windscribe','ipvanish','hotspot shield',
    'tunnelbear','hide.me','purevpn','ivpn','perfect privacy','airvpn','torguard','privado','atlas vpn',
    'strongvpn','vyprvpn','zenmate','browsec','urban vpn','psiphon','tor exit','anonymizer','relay',
    'amazon','aws','amazon.com','google cloud','google llc','google fi','microsoft azure','microsoft corporation',
    'digitalocean','linode','vultr','ovh','hetzner','choopa','m247','leaseweb','contabo',
    'scaleway','oracle cloud','psychz','g-core','frantech','packet','datacamp','host europe',
    'cloudflare','alibaba cloud','tencent cloud','upcloud','servermania','hostinger','ionos',
    'quadranet','sharktech','worldstream','flokinet','njal.la','cdn77','gcore','netcup',
    // CDN / edge networks (iCloud Private Relay, WARP, etc. egress here)
    'fastly','akamai','edgecast','stackpath','limelight','lumen','incapsula','imperva','apple inc',
    'apple cdn','section.io','ceres computing','tzulo','wired isp','wiredisp',
    // generic hosting-language catch-alls
    'hosting','data center','datacenter','colocation',' colo ','dedicated server','cloud services',
    'network solutions','server ',' isp inc','isp llc'
  ];

  function logLine(text, kind){
    const row = document.createElement('div');
    row.className = 'gate-log-line ' + kind;
    const icon = kind === 'ok' ? '✓' : kind === 'fail' ? '✗' : '›';
    row.innerHTML = `<span class="gl-icon">${icon}</span><span>${text}</span>`;
    logEl.appendChild(row);
    return row;
  }

  async function fetchWithTimeout(url, ms){
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, { signal: ctrl.signal }); }
    finally { clearTimeout(t); }
  }

  // Static aggregated VPN-range database (X4BNet/lists_vpn) — this is
  // the same public dataset production tools like Azure Sentinel's
  // "Consumer VPN Logins" KQL query use for exactly this purpose.
  // It's compiled from VPN providers' own published server ranges,
  // so it catches known providers even when their exit IP's WHOIS
  // org name looks nothing like "VPN" (generic reseller shells,
  // white-labeled server names, etc). Fetched once and cached.
  let vpnCidrCache = null;
  function ipToInt(ip){
    const parts = ip.split('.').map(Number);
    if (parts.length !== 4 || parts.some(p => isNaN(p) || p < 0 || p > 255)) return null;
    return ((parts[0]<<24) >>> 0) + (parts[1]<<16) + (parts[2]<<8) + parts[3];
  }
  function ipInCidr(ipInt, base, bits){
    if (bits === 0) return true;
    const mask = bits >= 32 ? 0xFFFFFFFF : (~0 << (32 - bits)) >>> 0;
    return (ipInt & mask) >>> 0 === (base & mask) >>> 0;
  }
  async function loadVpnCidrList(){
    if (vpnCidrCache) return vpnCidrCache;
    const res = await fetchWithTimeout('https://raw.githubusercontent.com/X4BNet/lists_vpn/main/output/vpn/ipv4.txt', 12000);
    if (!res.ok) throw new Error('cidr list failed: ' + res.status);
    const text = await res.text();
    const entries = [];
    text.split('\n').forEach(line => {
      const t = line.trim();
      if (!t || t.startsWith('#')) return;
      const [range, bitsStr] = t.split('/');
      const base = ipToInt(range);
      const bits = bitsStr ? parseInt(bitsStr, 10) : 32;
      if (base !== null && !isNaN(bits)) entries.push({ base, bits });
    });
    vpnCidrCache = entries;
    return entries;
  }
  async function checkCidrList(ip){
    const list = await loadVpnCidrList();
    const ipInt = ipToInt(ip);
    const hit = ipInt !== null && list.some(e => ipInCidr(ipInt, e.base, e.bits));
    return {
      source: `X4BNet VPN range DB (${list.length.toLocaleString()} CIDRs)`, label: 'VPN CIDR list',
      ip, org: hit ? 'matched known VPN netblock' : '—', country: '—',
      flags: { cidr_match: hit }, isVpn: hit,
    };
  }

  // Resolve the browser's actual egress IP first via a dedicated,
  // minimal echo service, then explicitly query both intelligence
  // sources against that exact IP — this avoids relying on either
  // API's undocumented "auto-detect caller" behavior, which is
  // where most false negatives were coming from.
  async function resolveOwnIp(){
    const res = await fetchWithTimeout('https://api.ipify.org?format=json', 6000);
    if (!res.ok) throw new Error('ipify failed');
    const d = await res.json();
    if (!d.ip) throw new Error('no ip returned');
    return d.ip;
  }

  async function checkDedicated(ip){
    const res = await fetchWithTimeout(`https://api.ipapi.is/?q=${ip}`, 8000);
    if (!res.ok) throw new Error('ipapi.is failed: ' + res.status);
    const d = await res.json();
    const flags = { vpn: !!d.is_vpn, proxy: !!d.is_proxy, datacenter: !!d.is_datacenter, tor: !!d.is_tor };
    return {
      source: 'api.ipapi.is (VPN exit-node DB)', label: 'VPN/proxy DB',
      ip: d.ip || ip,
      org: (d.company && d.company.name) || (d.asn && (d.asn.org || d.asn.name)) || '—',
      country: (d.location && d.location.country) || (d.datacenter && d.datacenter.country) || '—',
      flags,
      isVpn: flags.vpn || flags.proxy || flags.datacenter || flags.tor,
    };
  }

  async function checkKeyword(ip){
    const res = await fetchWithTimeout(`https://ipapi.co/${ip}/json/`, 8000);
    if (!res.ok) throw new Error('ipapi.co failed: ' + res.status);
    const d = await res.json();
    const org = (d.org || '').toLowerCase();
    const hit = VPN_HOST_KEYWORDS.find(k => org.includes(k));
    return {
      source: 'ipapi.co (ASN keyword cross-check)', label: 'ASN/CDN keywords',
      ip: d.ip || ip,
      org: d.org || '—',
      country: d.country_name || '—',
      flags: { keyword_match: hit || null },
      isVpn: !!hit,
      utcOffset: d.utc_offset || null,   // e.g. "+0200" — used for the timezone check below
      timezoneName: d.timezone || null,
    };
  }

  // A VPN doesn't move your computer's clock — it only moves your
  // apparent IP location. Someone genuinely browsing from Bulgaria
  // has a system timezone that matches Bulgaria; someone tunneling
  // through a Bulgarian exit node almost never bothers to change
  // their OS timezone to match. Comparing the two independently of
  // any VPN database catches exit nodes neither database has
  // classified yet — this is the same signal ipapi.is cites using
  // server-side. Threshold is 90 minutes to tolerate DST/half-hour
  // zone edge cases.
  function checkTimezoneMismatch(ipData){
    if (!ipData || !ipData.utcOffset) return null;
    const m = String(ipData.utcOffset).match(/^([+-])(\d{2})(\d{2})$/);
    if (!m) return null;
    const ipOffsetMin = (m[1] === '-' ? -1 : 1) * (parseInt(m[2],10)*60 + parseInt(m[3],10));
    const browserOffsetMin = -new Date().getTimezoneOffset();
    const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown';
    const diff = Math.abs(ipOffsetMin - browserOffsetMin);
    const fmt = min => (min>=0?'+':'-') + String(Math.floor(Math.abs(min)/60)).padStart(2,'0') + ':' + String(Math.abs(min)%60).padStart(2,'0');
    return {
      source: 'System clock vs IP-geolocated timezone', label: 'Timezone match',
      ip: ipData.ip,
      org: `browser: ${browserTz} (UTC${fmt(browserOffsetMin)})`,
      country: `IP timezone: ${ipData.timezoneName || '—'} (UTC${fmt(ipOffsetMin)})`,
      flags: { diff_minutes: diff },
      isVpn: diff >= 90,
    };
  }

  function renderDetail(results){
    if (!results || !results.length){ detailEl.innerHTML = ''; return; }
    const ip = results.find(r => r.ip && r.ip !== '—')?.ip || '—';
    const rows = results.map(r => `
      <div class="gdr${r.isVpn ? ' hit' : ''}" title="${escapeHtml(r.org && r.org !== '—' ? r.org : r.source)}">
        <span class="gdr-dot"></span>
        <span class="gdr-label">${escapeHtml(r.label || r.source)}</span>
        <span class="gdr-tag">${r.isVpn ? 'HIT' : 'clean'}</span>
      </div>
    `).join('');
    detailEl.innerHTML = `<div class="gate-detail-ip">egress ${escapeHtml(ip)}</div>${rows}`;
  }

  function glitchText(node, finalText){
    const chars = '!<>-_\\/[]{}—=+*^?#________';
    let frame = 0;
    const iv = setInterval(() => {
      node.textContent = finalText.split('').map((c, i) => {
        if (c === ' ') return ' ';
        return frame > i * 1.4 ? c : chars[Math.floor(Math.random()*chars.length)];
      }).join('');
      frame++;
      if (frame > finalText.length * 1.4){ clearInterval(iv); node.textContent = finalText; }
    }, 22);
  }

  function pass(results){
    statusEl.className = 'gate-status show pass';
    statusTitle.textContent = '◢◤ ACCESS GRANTED ◢◤';
    glitchText(statusTitle, '◢◤ ACCESS GRANTED ◢◤');
    statusBody.textContent = 'OPSEC LEVEL: ANONYMOUS — decrypting console shell…';
    renderDetail(results);
    actionsEl.style.display = 'none';
    setTimeout(() => {
      gateEl.classList.add('gate-hidden');
      setTimeout(() => { gateEl.style.display = 'none'; }, 550);
      window.loadMainframeAssets();
    }, 750);
  }

  function fail(results, errored){
    statusEl.className = 'gate-status show fail';
    const title = errored ? 'CHECK FAILED — UNKNOWN EXPOSURE' : 'ACCESS DENIED — OPSEC LEVEL: PENETRABLE';
    statusTitle.textContent = title;
    glitchText(statusTitle, title);
    statusBody.textContent = errored
      ? "All lookups were unreachable — blocked by a privacy extension, offline, or rate-limited. Your VPN status could not be confirmed either way."
      : 'No VPN/proxy database hit, no ASN/CDN keyword match, and your system clock matches your IP\'s timezone. Looks like bare residential traffic. Light up a tunnel and re-run the scan.';
    if (results && results.length) renderDetail(results);
    else detailEl.innerHTML = '';
    actionsEl.style.display = 'flex';
  }

  async function runCheck(){
    statusEl.className = 'gate-status';
    actionsEl.style.display = 'none';
    logEl.innerHTML = '';

    const l0 = logLine('Tracing egress route…', 'pending');
    let ip;
    try {
      ip = await resolveOwnIp();
      l0.className = 'gate-log-line ok';
      logLine(`Egress IP pinned: ${ip}`, 'ok');
    } catch (e0) {
      l0.className = 'gate-log-line fail';
      logLine('Could not resolve egress IP — network blocked or offline.', 'fail');
      fail(null, true);
      return;
    }

    const l1 = logLine('Querying VPN exit-node database…', 'pending');
    const l2 = logLine('Cross-referencing ASN / CDN / hosting registries…', 'pending');
    const l3 = logLine('Matching against known VPN netblock ranges…', 'pending');
    await new Promise(r => setTimeout(r, 200));

    const settled = await Promise.allSettled([checkDedicated(ip), checkKeyword(ip), checkCidrList(ip)]);
    const results = [];
    let keywordData = null;
    if (settled[0].status === 'fulfilled'){ l1.className = 'gate-log-line ok'; results.push(settled[0].value); }
    else { l1.className = 'gate-log-line fail'; l1.querySelector('span:last-child').textContent = 'VPN exit-node database unreachable.'; }
    if (settled[1].status === 'fulfilled'){ l2.className = 'gate-log-line ok'; keywordData = settled[1].value; results.push(keywordData); }
    else { l2.className = 'gate-log-line fail'; l2.querySelector('span:last-child').textContent = 'ASN registry cross-check unreachable.'; }
    if (settled[2].status === 'fulfilled'){ l3.className = 'gate-log-line ok'; results.push(settled[2].value); }
    else { l3.className = 'gate-log-line fail'; l3.querySelector('span:last-child').textContent = 'VPN netblock list unreachable.'; }

    // Cross-source org-attribution mismatch: two independent WHOIS
    // databases disagreeing on who owns the same IP is unusual for
    // stable residential allocations, and common for recently
    // leased/rotated proxy or VPN infrastructure.
    if (settled[0].status === 'fulfilled' && settled[1].status === 'fulfilled'){
      const orgA = (settled[0].value.org || '').toLowerCase();
      const orgB = (settled[1].value.org || '').toLowerCase();
      const related = orgA === '—' || orgB === '—' || orgA.includes(orgB) || orgB.includes(orgA);
      if (!related){
        logLine('ASN attribution conflict between sources — anomalous.', 'ok');
        results.push({
          source: 'Cross-source ASN attribution check', label: 'ASN attribution',
          ip, org: `"${settled[0].value.org}" vs "${settled[1].value.org}"`, country: '—',
          flags: { conflict: true }, isVpn: true,
        });
      }
    }

    // Timezone vs IP-geolocation mismatch — independent of both
    // databases above, catches gaps in VPN-provider coverage.
    if (keywordData){
      const tzResult = checkTimezoneMismatch(keywordData);
      if (tzResult){
        logLine(tzResult.isVpn ? 'System clock does not match IP timezone — anomalous.' : 'System clock matches IP timezone.', 'ok');
        results.push(tzResult);
      }
    }

    await new Promise(r => setTimeout(r, 200));
    const anyHit = results.some(r => r.isVpn);
    logLine('Evaluating opsec posture…', anyHit ? 'ok' : (results.length ? 'fail' : 'fail'));

    if (results.length === 0) fail(null, true);
    else if (anyHit) pass(results);
    else fail(results, false);
  }

  retryBtn.addEventListener('click', runCheck);
  overrideBtn.addEventListener('click', () => {
    gateEl.classList.add('gate-hidden');
    setTimeout(() => { gateEl.style.display = 'none'; }, 550);
    window.loadMainframeAssets();
  });

  runCheck();
})();

/* ============================================================
   MATRIX RAIN — classic falling-code background
============================================================ */
(function matrixRain(){
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  const GLYPHS = 'アカサタナハマヤラワガザダバパイキシチニヒミリヰギジヂビピウクスツヌフムユルグズヅブプエケセテネヘメレヱゲゼデベペオコソトノホモヨロヲゴゾドボポヴッン0123456789';
  const FONT_SIZE = 15;
  let cols, drops, w, h;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / FONT_SIZE);
    drops = Array.from({length: cols}, () => Math.random() * -100);
  }

  function tick(){
    // fading trail: translucent black wash instead of a full clear
    ctx.fillStyle = 'rgba(6,9,7,0.08)';
    ctx.fillRect(0, 0, w, h);

    ctx.font = FONT_SIZE + 'px "IBM Plex Mono", monospace';
    for (let i = 0; i < cols; i++){
      const glyph = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      const x = i * FONT_SIZE;
      const y = drops[i] * FONT_SIZE;

      // leading character brighter/whiter, trail phosphor green,
      // rare amber glyph for the accent color
      const roll = Math.random();
      ctx.fillStyle = roll < 0.02 ? '#eaf7ef' : roll < 0.05 ? 'rgba(255,180,84,0.75)' : 'rgba(61,255,160,0.55)';
      ctx.fillText(glyph, x, y);

      if (y > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  tick();
})();


/* ============================================================
   ASSET LOADER — fetches the app bundle (markup + logic) from
   its own repo once the opsec gate has passed, injects it, and
   executes its script as a real running script (innerHTML never
   executes <script> tags, so we recreate the node manually).
   window.__MFOPSEC_UNLOCKED__ is the signal the bundle's own
   script checks before it does anything — see asset.html.

   IMPORTANT: a synchronous error thrown *inside* a dynamically
   inserted <script> does NOT propagate back through appendChild()
   as a catchable exception — the browser just fires a global
   'error' event instead. A plain try/catch around the injection
   would silently miss that failure. So this also installs a
   window-level error/rejection listener and renders whatever it
   catches directly on screen, since there's no console to check.
============================================================ */
const ASSET_BUNDLE_URL = 'https://raw.githubusercontent.com/396abc/sigma-frontend-for-open-router/refs/heads/main/dir/asset.html';

function escapeLoaderHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showBootError(title, detail){
  const root = document.getElementById('assetRoot');
  root.innerHTML = `
    <div class="boot-loading boot-error">
      <div class="boot-text"><strong>${escapeLoaderHtml(title)}</strong><br>${escapeLoaderHtml(detail || '')}</div>
      <button class="boot-retry" id="bootRetry">Retry</button>
    </div>`;
  document.getElementById('bootRetry').addEventListener('click', window.loadMainframeAssets);
}

// Catches errors from the injected bundle script too (see note above),
// plus any later runtime errors — this is the mobile-friendly stand-in
// for an open devtools console.
let bootPhaseDone = false;
window.addEventListener('error', e => {
  if (bootPhaseDone) return; // don't hijack normal in-app errors after a successful boot
  showBootError('Script error while starting the app', `${e.message} (${e.filename ? e.filename.split('/').pop() : 'unknown'}:${e.lineno || '?'})`);
});
window.addEventListener('unhandledrejection', e => {
  if (bootPhaseDone) return;
  showBootError('Unhandled error while starting the app', (e.reason && e.reason.message) || String(e.reason));
});

window.loadMainframeAssets = async function loadMainframeAssets(){
  const root = document.getElementById('assetRoot');
  root.innerHTML = `
    <div class="boot-loading" id="bootLoading">
      <div class="boot-spinner"></div>
      <div class="boot-text">Fetching asset bundle…</div>
    </div>`;

  if (location.protocol === 'file:'){
    showBootError(
      'Opened as a local file',
      "This page is running from file:// (a downloaded file opened directly), and browsers block fetch() from file:// to an external https URL. Host index.html somewhere real — GitHub Pages, Netlify, Vercel, or `python3 -m http.server` — and open it via http(s):// instead."
    );
    return;
  }

  try {
    const res = await fetch(ASSET_BUNDLE_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok){
      showBootError(`Fetch failed — HTTP ${res.status}`, res.status === 404
        ? 'The file was not found at that exact path in the repo. Double-check the branch and path.'
        : 'The bundle URL responded, but not with success.');
      return;
    }
    const text = await res.text();
    if (!text || !text.trim()){
      showBootError('Fetched an empty response', 'The request succeeded but returned no content.');
      return;
    }

    const doc = new DOMParser().parseFromString(text, 'text/html');
    if (!doc.body || doc.body.children.length === 0){
      showBootError('Could not parse the bundle', `Got ${text.length} characters back, but DOMParser found no elements in it. First 120 chars: ${text.slice(0,120)}`);
      return;
    }

    // The bundle may ship its own <style> in future revisions — inject
    // it defensively, even though this build keeps all styling here.
    doc.querySelectorAll('style').forEach(styleTag => {
      const s = document.createElement('style');
      s.textContent = styleTag.textContent;
      document.head.appendChild(s);
    });

    // Inject markup — everything in the bundle's <body> except <script>.
    root.innerHTML = '';
    Array.from(doc.body.children).forEach(node => {
      if (node.tagName !== 'SCRIPT') root.appendChild(node);
    });

    if (!document.getElementById('app')){
      showBootError('Bundle markup is missing #app', 'The fetched HTML parsed fine but did not contain the expected app container — check the bundle file itself.');
      return;
    }

    // Flip the unlock flag, THEN execute the bundle's script(s). Setting
    // innerHTML on a <script> never runs it, so each one is rebuilt as a
    // fresh element and appended — the standard way to run fetched code.
    window.__MFOPSEC_UNLOCKED__ = true;
    const scripts = Array.from(doc.body.querySelectorAll('script'));
    if (scripts.length === 0){
      showBootError('Bundle has no <script> tag', 'The markup loaded, but there was no script to execute — the app has no logic wired up.');
      return;
    }
    for (const old of scripts){
      const fresh = document.createElement('script');
      fresh.textContent = old.textContent;
      document.body.appendChild(fresh);
    }

    // Confirm the bundle's script actually ran and wired up a real
    // element (sendBtn only exists if its script executed cleanly) —
    // if not, a global 'error' listener above has likely already shown
    // the real reason; this is a fallback in case it fired silently.
    setTimeout(() => {
      if (!document.getElementById('sendBtn')){
        showBootError('App did not finish starting', 'The bundle loaded and its script ran, but the composer never appeared. This usually means the script hit an error very early — if no other message appeared above this one, try Retry once more.');
        return;
      }
      bootPhaseDone = true;
      requestAnimationFrame(() => {
        const appEl = document.getElementById('app');
        if (appEl) appEl.classList.remove('app-locked');
      });
    }, 60);
  } catch (e){
    showBootError('Network error', `${e.name}: ${e.message}. If you're testing this by opening a downloaded file, that's very likely it — see the file:// note above.`);
  }
};
</script>
</body>
</html>
