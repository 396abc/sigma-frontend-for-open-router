<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#060907" />
<title>MainframeOpSec AI — Secure Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   TOKENS — MainframeOpSec design system
   A hardened-terminal aesthetic: phosphor-green readouts,
   amber alert accents, scanline atmosphere, classified-log
   framing. Everything is styled like a secure ops console,
   not a generic dark chatbot.
============================================================ */
:root{
  --void:            #060907;
  --void-2:          #0a0f0c;
  --panel:           rgba(14, 20, 17, 0.62);
  --panel-solid:     #0d1310;
  --panel-raised:    rgba(22, 30, 25, 0.7);
  --hair:            rgba(120, 200, 160, 0.12);
  --hair-strong:     rgba(120, 200, 160, 0.24);
  --phosphor:        #3dffa0;
  --phosphor-dim:    #1f6b47;
  --phosphor-glow:   rgba(61, 255, 160, 0.45);
  --amber:           #ffb454;
  --amber-glow:      rgba(255, 180, 84, 0.45);
  --danger:          #ff5c5c;
  --text-hi:         #eaf7ef;
  --text:            #b9ccc0;
  --text-mute:       #6f8a7c;
  --text-dim:        #3d5347;

  --font-display:    'JetBrains Mono', monospace;
  --font-mono:       'IBM Plex Mono', monospace;
  --font-body:       'Inter', sans-serif;

  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 8px;

  --ease: cubic-bezier(.22,1,.36,1);
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
html{ -webkit-text-size-adjust: 100%; }
body{
  margin:0;
  background: var(--void);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  overflow-x: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
::selection{ background: var(--phosphor-dim); color: var(--text-hi); }

/* scrollbars */
*::-webkit-scrollbar{ width:8px; height:8px; }
*::-webkit-scrollbar-track{ background: transparent; }
*::-webkit-scrollbar-thumb{ background: var(--hair-strong); border-radius: 10px; }
*::-webkit-scrollbar-thumb:hover{ background: var(--phosphor-dim); }

/* ============================================================
   ATMOSPHERE — layered background: radial glow field,
   drifting particle canvas, and a faint CRT scanline overlay.
============================================================ */
.atmosphere{
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 50% at 18% 8%, rgba(61,255,160,0.09), transparent 60%),
    radial-gradient(50% 45% at 85% 15%, rgba(255,180,84,0.06), transparent 60%),
    radial-gradient(80% 60% at 50% 100%, rgba(20,60,45,0.16), transparent 70%),
    var(--void);
}
#particleCanvas{ position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.55; }
.scanlines{
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.018) 0px,
    rgba(255,255,255,0.018) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode: overlay;
  animation: scan-drift 9s linear infinite;
}
@keyframes scan-drift{ 0%{ background-position: 0 0; } 100%{ background-position: 0 60px; } }
.vignette{
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  box-shadow: inset 0 0 220px rgba(0,0,0,0.65);
}

/* ============================================================
   APP SHELL
============================================================ */
.app{
  position: relative; z-index: 2;
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100vh;
  transition: grid-template-columns .45s var(--ease);
}
.app.sidebar-collapsed{ grid-template-columns: 0px 1fr; }

.sidebar-scrim{
  display: none;
  position: fixed; inset: 0; z-index: 25;
  background: rgba(3,5,4,0.6);
  backdrop-filter: blur(2px);
  opacity: 0;
  transition: opacity .35s var(--ease);
}

/* ============================================================
   SIDEBAR
============================================================ */
.sidebar{
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(13,19,16,0.86), rgba(9,13,11,0.92));
  border-right: 1px solid var(--hair);
  display: flex; flex-direction: column;
  min-width: 0;
  transition: opacity .35s var(--ease);
  backdrop-filter: blur(18px);
}
.app.sidebar-collapsed .sidebar{ opacity: 0; pointer-events: none; }

.brand{
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--hair);
}
.brand-mark{
  display:flex; align-items:baseline; gap: 8px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 0.5px;
  color: var(--text-hi);
}
.brand-mark .slash{ color: var(--phosphor); }
.brand-cursor{
  display:inline-block; width:8px; height:15px; background: var(--phosphor);
  box-shadow: 0 0 8px var(--phosphor-glow);
  animation: blink 1.1s steps(1) infinite;
}
@keyframes blink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
.brand-sub{
  margin-top: 6px; font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 1.6px; text-transform: uppercase; color: var(--text-mute);
}

.new-session{
  margin: 16px 16px 10px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: linear-gradient(180deg, rgba(61,255,160,0.10), rgba(61,255,160,0.04));
  border: 1px solid rgba(61,255,160,0.28);
  color: var(--text-hi);
  font-family: var(--font-mono);
  font-size: 12.5px;
  letter-spacing: 0.4px;
  display:flex; align-items:center; gap:10px;
  cursor: pointer;
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
}
.new-session:hover{
  transform: translateY(-1px);
  box-shadow: 0 8px 24px -8px var(--phosphor-glow), inset 0 0 0 1px rgba(61,255,160,0.35);
  background: linear-gradient(180deg, rgba(61,255,160,0.16), rgba(61,255,160,0.05));
}
.new-session .plus{ font-size: 15px; color: var(--phosphor); }

.session-search{
  margin: 4px 16px 12px;
  position: relative;
}
.session-search input{
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--hair);
  border-radius: var(--r-sm);
  padding: 8px 10px 8px 30px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11.5px;
  outline: none;
  transition: border-color .2s;
}
.session-search input:focus{ border-color: var(--hair-strong); }
.session-search svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.5; }

.session-log-label{
  padding: 4px 20px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--text-dim);
}

.session-list{ flex:1; overflow-y: auto; padding: 0 10px 10px; }
.session-item{
  display:flex; align-items:flex-start; gap:10px;
  padding: 10px 10px;
  margin-bottom: 3px;
  border-radius: var(--r-sm);
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .2s, border-color .2s;
  position: relative;
}
.session-item:hover{ background: rgba(255,255,255,0.03); }
.session-item.active{
  background: rgba(61,255,160,0.06);
  border-color: rgba(61,255,160,0.22);
}
.session-dot{
  width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0;
  background: var(--text-dim);
}
.session-item.active .session-dot{
  background: var(--phosphor);
  box-shadow: 0 0 0 3px rgba(61,255,160,0.15);
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot{
  0%,100%{ box-shadow: 0 0 0 2px rgba(61,255,160,0.12); }
  50%{ box-shadow: 0 0 0 5px rgba(61,255,160,0.06); }
}
.session-meta{ min-width:0; flex:1; }
.session-title{
  font-size: 12.5px; color: var(--text-hi); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-item.active .session-title{ color: var(--phosphor); }
.session-sub{
  margin-top:3px; display:flex; align-items:center; gap:6px;
  font-family: var(--font-mono); font-size: 9.5px; color: var(--text-mute);
}
.tag{
  font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .6px;
  padding: 1px 5px; border-radius: 3px; text-transform: uppercase;
}
.tag.active{ background: rgba(61,255,160,0.14); color: var(--phosphor); }
.tag.archived{ background: rgba(255,255,255,0.05); color: var(--text-mute); }

.sidebar-footer{
  border-top: 1px solid var(--hair);
  padding: 12px 16px;
}
.model-select-wrap{
  margin-bottom: 10px;
}
.field-label{
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
}
select#sidebarModel{
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--hair);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11.5px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  outline: none;
  appearance: none;
  cursor: pointer;
}
select#sidebarModel:focus{ border-color: var(--phosphor-dim); }

.operator{
  display:flex; align-items:center; gap:10px;
  padding: 8px; border-radius: var(--r-sm);
  cursor: pointer; transition: background .2s;
}
.operator:hover{ background: rgba(255,255,255,0.03); }
.operator-avatar{
  width: 32px; height:32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--phosphor-dim), var(--void-2));
  border: 1px solid var(--hair-strong);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-size: 12px; color: var(--phosphor); font-weight:700;
}
.operator-name{ font-size: 12.5px; color: var(--text-hi); font-weight: 500; }
.operator-clearance{
  font-family: var(--font-mono); font-size: 9px; color: var(--amber); letter-spacing: .5px;
}

/* ============================================================
   MAIN COLUMN
============================================================ */
.main{
  position: relative;
  display: flex; flex-direction: column;
  min-width: 0; height: 100vh;
}

.topbar{
  display:flex; align-items:center; gap: 14px;
  padding: 14px 22px;
  border-bottom: 1px solid var(--hair);
  background: rgba(8,12,10,0.4);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}
.icon-btn{
  width: 32px; height: 32px; border-radius: var(--r-sm);
  display:flex; align-items:center; justify-content:center;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--hair);
  color: var(--text-mute);
  cursor: pointer;
  transition: all .2s var(--ease);
}
.icon-btn:hover{ color: var(--phosphor); border-color: var(--hair-strong); background: rgba(61,255,160,0.06); }

.topbar-title{
  font-family: var(--font-display); font-size: 13px; color: var(--text-hi); font-weight: 600;
}
.topbar-sub{
  font-family: var(--font-mono); font-size: 10px; color: var(--text-mute); margin-top: 2px;
}
.topbar-meters{
  margin-left: auto; display:flex; align-items:center; gap: 18px;
}
.meter{ text-align: right; }
.meter-label{ font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
.meter-value{ font-family: var(--font-mono); font-size: 12px; color: var(--text-hi); }
.ctx-bar{
  width: 110px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06);
  overflow: hidden; margin-top: 5px;
}
.ctx-bar-fill{
  height: 100%; width: 6%;
  background: linear-gradient(90deg, var(--phosphor-dim), var(--phosphor));
  box-shadow: 0 0 8px var(--phosphor-glow);
  transition: width .5s var(--ease);
}

/* ============================================================
   MESSAGES
============================================================ */
.chat-scroll{
  flex: 1; overflow-y: auto;
  padding: 30px 20px 160px;
  scroll-behavior: smooth;
}
.chat-inner{ max-width: 760px; margin: 0 auto; display:flex; flex-direction:column; gap: 22px; }

.empty-state{
  max-width: 560px; margin: 8vh auto 0; text-align:center;
}
.empty-glyph{
  width: 56px; height: 56px; margin: 0 auto 18px;
  border-radius: 14px;
  border: 1px solid var(--hair-strong);
  background: linear-gradient(160deg, rgba(61,255,160,0.12), rgba(61,255,160,0.02));
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 0 30px -6px var(--phosphor-glow);
}
.empty-state h2{
  font-family: var(--font-display); color: var(--text-hi); font-size: 19px;
  margin: 0 0 8px; letter-spacing: .3px;
}
.empty-state p{ color: var(--text-mute); font-size: 13.5px; line-height: 1.6; margin: 0 0 22px; }
.suggestion-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.suggestion{
  text-align:left; padding: 12px 14px; border-radius: var(--r-md);
  background: var(--panel); border: 1px solid var(--hair);
  cursor:pointer; transition: all .25s var(--ease);
}
.suggestion:hover{ border-color: var(--hair-strong); transform: translateY(-2px); box-shadow: 0 10px 26px -14px rgba(0,0,0,.6); }
.suggestion .s-title{ font-size: 12.5px; color: var(--text-hi); font-weight:500; margin-bottom:3px; }
.suggestion .s-sub{ font-size: 11px; color: var(--text-mute); font-family: var(--font-mono); }

.msg{
  display:flex; gap: 12px;
  animation: msg-in .45s var(--ease) both;
}
@keyframes msg-in{
  from{ opacity:0; transform: translateY(10px) scale(.99); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}
.msg-avatar{
  width: 30px; height: 30px; border-radius: 8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-size: 10px; font-weight: 700;
  margin-top: 2px;
}
.msg.user .msg-avatar{
  background: rgba(255,180,84,0.1); border: 1px solid rgba(255,180,84,0.3); color: var(--amber);
}
.msg.ai .msg-avatar{
  background: rgba(61,255,160,0.1); border: 1px solid rgba(61,255,160,0.3); color: var(--phosphor);
}
.msg-body{ min-width: 0; flex: 1; }
.msg-head{
  display:flex; align-items:baseline; gap:8px; margin-bottom: 5px;
}
.msg-role{ font-family: var(--font-mono); font-size: 11px; font-weight:600; letter-spacing: .4px; color: var(--text-hi); }
.msg.user .msg-role{ color: var(--amber); }
.msg.ai .msg-role{ color: var(--phosphor); }
.msg-time{ font-family: var(--font-mono); font-size: 9.5px; color: var(--text-dim); }
.msg-hash{ font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); margin-left: auto; }

.bubble{
  background: var(--panel);
  border: 1px solid var(--hair);
  border-radius: var(--r-md);
  padding: 12px 15px;
  font-size: 13.8px; line-height: 1.65;
  color: var(--text);
  backdrop-filter: blur(14px);
  position: relative;
}
.msg.user .bubble{ background: rgba(255,180,84,0.045); border-color: rgba(255,180,84,0.14); }
.bubble p{ margin: 0 0 8px; }
.bubble p:last-child{ margin-bottom: 0; }
.bubble ul{ margin: 6px 0; padding-left: 20px; }
.bubble li{ margin-bottom: 4px; }
.bubble strong{ color: var(--text-hi); }
.bubble code.inline{
  background: rgba(61,255,160,0.08); color: var(--phosphor);
  padding: 1px 5px; border-radius: 4px; font-family: var(--font-mono); font-size: 12.5px;
}

.codeblock{
  margin: 10px 0; border-radius: var(--r-sm); overflow:hidden;
  border: 1px solid var(--hair-strong);
  background: #080b09;
}
.codeblock-head{
  display:flex; align-items:center; justify-content:space-between;
  padding: 7px 12px; background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--hair);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-mute);
}
.copy-btn{
  display:flex; align-items:center; gap:5px;
  background: none; border: 1px solid var(--hair-strong); color: var(--text-mute);
  font-family: var(--font-mono); font-size: 10px;
  padding: 3px 8px; border-radius: 5px; cursor:pointer;
  transition: all .2s var(--ease);
}
.copy-btn:hover{ color: var(--phosphor); border-color: var(--phosphor-dim); }
.copy-btn.copied{ color: var(--phosphor); border-color: var(--phosphor); }
.codeblock pre{
  margin:0; padding: 12px 14px; overflow-x:auto;
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
  color: #cdeedd;
}
.tok-kw{ color: #ff8fb3; } .tok-str{ color: #ffd479; } .tok-com{ color: #5c7a6c; } .tok-fn{ color: #6fd8ff; } .tok-num{ color: #b592ff; }

/* reasoning trace (shown when reasoning mode is on) */
.reasoning{
  margin-bottom: 8px;
  border: 1px dashed var(--hair-strong);
  border-radius: var(--r-sm);
  background: rgba(255,180,84,0.03);
  overflow: hidden;
  animation: msg-in .4s var(--ease) both;
}
.reasoning-head{
  display:flex; align-items:center; gap:8px;
  padding: 8px 12px; cursor: pointer;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--amber); letter-spacing:.4px;
}
.reasoning-head svg{ transition: transform .25s var(--ease); }
.reasoning.open .reasoning-head svg{ transform: rotate(90deg); }
.reasoning-body{
  max-height: 0; overflow:hidden; transition: max-height .35s var(--ease);
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-mute);
  padding: 0 12px; line-height: 1.7;
}
.reasoning.open .reasoning-body{ max-height: 240px; padding: 0 12px 12px; overflow-y:auto; }

/* tool usage indicator */
.tool-badge{
  display:inline-flex; align-items:center; gap:7px;
  padding: 6px 11px; border-radius: 20px;
  background: rgba(111,216,255,0.08); border: 1px solid rgba(111,216,255,0.25);
  font-family: var(--font-mono); font-size: 10.5px; color: #6fd8ff;
  margin-bottom: 8px;
  animation: msg-in .3s var(--ease) both;
}
.tool-badge .tool-spin{
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid rgba(111,216,255,0.35); border-top-color: #6fd8ff;
  animation: spin .7s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

/* typing indicator */
.typing{ display:flex; align-items:center; gap: 10px; }
.typing-dots{ display:flex; gap: 4px; padding: 12px 15px; }
.typing-dots span{
  width:6px; height:6px; border-radius:50%; background: var(--phosphor);
  animation: bounce 1.1s infinite ease-in-out;
  box-shadow: 0 0 6px var(--phosphor-glow);
}
.typing-dots span:nth-child(2){ animation-delay: .15s; }
.typing-dots span:nth-child(3){ animation-delay: .3s; }
@keyframes bounce{ 0%,60%,100%{ transform: translateY(0); opacity:.5; } 30%{ transform: translateY(-5px); opacity:1; } }

.cursor-blip{
  display:inline-block; width:7px; height:14px; background: var(--phosphor);
  margin-left:2px; vertical-align: middle; box-shadow: 0 0 6px var(--phosphor-glow);
  animation: blink 0.9s steps(1) infinite;
}

/* ============================================================
   COMPOSER — floating glass console
============================================================ */
.composer-dock{
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 20px 20px;
  display:flex; justify-content:center;
  pointer-events: none;
}
.composer{
  pointer-events: all;
  width: 100%; max-width: 760px;
  border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(18,26,22,0.82), rgba(11,16,13,0.9));
  border: 1px solid var(--hair-strong);
  backdrop-filter: blur(22px);
  box-shadow: 0 -10px 40px -18px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.2);
  padding: 12px 14px 12px;
  transition: box-shadow .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  position: relative;
  overflow: hidden;
}
.composer::before{
  content:''; position:absolute; inset:-2px; border-radius: inherit; padding: 1px;
  background: linear-gradient(120deg, transparent, rgba(61,255,160,0.35), transparent);
  background-size: 200% 200%;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: 0; transition: opacity .3s;
  animation: liquid-border 6s linear infinite;
}
.composer.focused::before{ opacity: 1; }
@keyframes liquid-border{ 0%{ background-position: 0% 50%; } 100%{ background-position: 200% 50%; } }
.composer.focused{
  border-color: rgba(61,255,160,0.4);
  box-shadow: 0 -10px 50px -14px
